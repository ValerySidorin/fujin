services:
  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: artemis
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD", "/opt/activemq-artemis/bin/artemis", "check", "node", "--silent", "--timeout", "5000", "--url", "tcp://127.0.0.1:61616", "--user", "artemis", "--password", "artemis"]
      interval: 2s
      timeout: 6s
      retries: 30
      start_period: 2s
    restart: always
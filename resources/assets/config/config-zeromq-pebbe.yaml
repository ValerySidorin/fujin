quic:
  enabled: true
  tls:
    enabled: true
    server_cert_pem_path: /assets/certs/fujin.io.pem
    server_key_pem_path: /assets/certs/fujin.io-key.pem
grpc:
  enabled: true
tcp:
  enabled: true
connectors:
  connector:
    type: zeromq_pebbe
    settings:
      common:
        send_timeout: 5s
        ready_timeout: 10s
        receive_poll_interval: 100ms
        max_message_bytes: 4194304
        subscriber_queue_capacity: 256
      routes:
        pub:
          pattern: pub
          endpoint: tcp://*:5555
          mode: bind
          framing: fujin_v1
          topic: events.
        pull:
          pattern: pull
          endpoint: tcp://*:5556
          mode: bind
          framing: fujin_v1

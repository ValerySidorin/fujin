[application]
name = "fujin-go-test"
version = "0.1.0"
output = ".fujin/libfujin_go_test.dylib"
artifact = "cdylib"
generated_directory = ".fujin/generated"
fujin = { path = "../../../../crates/fujin" }

[[plugin]]
family = "configurator"
name = "env"
package = "fujin-configurator-env"
path = "../../../../plugins/configurator/env"

[[plugin]]
family = "connector"
name = "test-connector"
package = "fujin-go-test-connector"
path = "connector"

[[plugin]]
family = "transport"
name = "tcp"
package = "fujin-transport-tcp"
path = "../../../../plugins/transport/tcp"

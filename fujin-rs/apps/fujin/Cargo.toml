[package]
name = "fujin-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["full"]
full = [
    "configurator-env",
    "configurator-yaml",
    "kafka",
    "tcp",
    "unix",
    "websocket",
    "quic",
    "grpc",
]
configurator-env = ["fujin/configurator-env"]
configurator-yaml = ["fujin/configurator-yaml"]
kafka = ["fujin/kafka"]
tcp = ["fujin/tcp"]
unix = ["fujin/unix"]
websocket = ["fujin/websocket"]
quic = ["fujin/quic"]
grpc = ["fujin/grpc"]

[dependencies]
anyhow.workspace = true
fujin = { path = "../../crates/fujin", default-features = false }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "fujin"
path = "src/main.rs"

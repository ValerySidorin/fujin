[package]
name = "fujin-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
grpc = ["dep:fujin-proto", "dep:tonic", "dep:tonic-health", "dep:tonic-prost", "dep:tokio-stream"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
fujin-core = { path = "../fujin-core" }
fujin-transport = { path = "../fujin-transport" }
fujin-upgrade = { path = "../fujin-upgrade" }
fujin-proto = { path = "../fujin-proto", optional = true }
prost.workspace = true
parking_lot.workspace = true
fujin-runtime = { path = "../fujin-runtime" }
tokio.workspace = true
tokio-stream = { workspace = true, optional = true }
tokio-util.workspace = true
tonic-health = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
fujin-native = { path = "../fujin-native" }
serde_json.workspace = true

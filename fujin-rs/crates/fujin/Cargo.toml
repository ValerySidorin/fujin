[package]
name = "fujin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
full = ["kafka", "tcp", "unix", "websocket", "quic", "grpc"]
kafka = ["dep:fujin-kafka", "fujin-kafka/rdkafka"]
tcp = ["fujin-server/tcp"]
unix = ["fujin-server/unix"]
websocket = ["fujin-server/websocket"]
quic = ["fujin-server/quic"]
grpc = ["fujin-server/grpc"]

[dependencies]
anyhow.workspace = true
fujin-core = { path = "../fujin-core" }
fujin-kafka = { path = "../fujin-kafka", optional = true }
fujin-runtime = { path = "../fujin-runtime" }
fujin-server = { path = "../fujin-server", default-features = false }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

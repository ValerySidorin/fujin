[package]
name = "fujin-transports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
full = ["tcp", "unix", "websocket", "quic"]
tcp = []
unix = []
websocket = ["dep:bytes", "dep:futures-util", "dep:tokio-tungstenite"]
quic = ["dep:futures-util", "dep:humantime", "dep:quinn", "dep:tokio-util"]

[dependencies]
anyhow.workspace = true
bytes = { workspace = true, optional = true }
fujin-core = { path = "../../crates/fujin-core" }
fujin-runtime = { path = "../../crates/fujin-runtime" }
fujin-transport = { path = "../../crates/fujin-transport" }
fujin-upgrade = { path = "../../crates/fujin-upgrade" }
futures-util = { workspace = true, optional = true }
humantime = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

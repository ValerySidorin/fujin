[workspace]
resolver = "3"
members = [
    "crates/fujin-core",
    "crates/fujin-plugin-api",
    "crates/fujin-native",
    "crates/fujin-proto",
    "crates/fujin-transport",
    "crates/fujin-bench",
    "crates/fujin-tls",
    "plugins/configurators",
    "plugins/transports",
    "crates/fujin-runtime",
    "crates/fujin-kafka",
    "crates/fujin-upgrade",
    "crates/fujin",
    "plugins/nop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/fujin-io/fujin"

[workspace.dependencies]
anyhow = "1.0.100"
arc-swap = "1.9.2"
async-trait = "0.1.89"
bytes = "1.12.1"
futures-util = "0.3.34"
parking_lot = "0.12.5"
humantime = "2.4.0"
nix = { version = "0.31.3", features = ["socket", "uio"] }
prost = "0.14.3"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rdkafka = { version = "0.39.0", default-features = false, features = ["tokio", "cmake-build", "static-linking", "libz-static", "ssl-vendored"] }
rcgen = "0.14"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
stats_alloc = "0.1.10"
subtle = "2.6.1"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util", "fs"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "router", "codegen", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-health = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
yaml_serde = "0.10.7"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 1
strip = "none"

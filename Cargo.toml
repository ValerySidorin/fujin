[workspace]
resolver = "3"
members = [
    "apps/fujin",
    "crates/fujin",
    "crates/fujin-core",
    "crates/fujin-ffi",
    "crates/fujin-connector",
    "crates/fujin-configurator",
    "crates/fujin-error",
    "crates/fujin-native",
    "crates/fujin-middleware",
    "crates/fujin-grpc-proto",
    "crates/fujin-runtime",
    "crates/fujin-transport",
    "plugins/connector/kafka",
    "plugins/configurator/env",
    "plugins/configurator/file",
    "plugins/transport/quic",
    "plugins/transport/tcp",
    "plugins/transport/unix",
    "plugins/transport/websocket",
    "tools/cargo-fujin",
    "tools/bench",
]

[workspace.package]
version = "0.6.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/fujin-io/fujin"
homepage = "https://fujin.io"
documentation = "https://docs.rs/fujin"
readme = "README.md"
keywords = ["message-broker", "gateway", "kafka", "grpc"]
categories = ["asynchronous", "network-programming"]

[workspace.dependencies]
fujin = { path = "crates/fujin", version = "=0.6.0-alpha.1" }
fujin-configurator = { path = "crates/fujin-configurator", version = "=0.6.0-alpha.1" }
fujin-connector = { path = "crates/fujin-connector", version = "=0.6.0-alpha.1" }
fujin-core = { path = "crates/fujin-core", version = "=0.6.0-alpha.1" }
fujin-error = { path = "crates/fujin-error", version = "=0.6.0-alpha.1" }
fujin-ffi = { path = "crates/fujin-ffi", version = "=0.6.0-alpha.1" }
fujin-grpc-proto = { path = "crates/fujin-grpc-proto", version = "=0.6.0-alpha.1" }
fujin-middleware = { path = "crates/fujin-middleware", version = "=0.6.0-alpha.1" }
fujin-native = { path = "crates/fujin-native", version = "=0.6.0-alpha.1" }
fujin-runtime = { path = "crates/fujin-runtime", version = "=0.6.0-alpha.1" }
fujin-transport = { path = "crates/fujin-transport", version = "=0.6.0-alpha.1" }
fujin-configurator-env = { path = "plugins/configurator/env", version = "=0.6.0-alpha.1" }
fujin-configurator-file = { path = "plugins/configurator/file", version = "=0.6.0-alpha.1" }
fujin-connector-kafka = { path = "plugins/connector/kafka", version = "=0.6.0-alpha.1" }
fujin-transport-quic = { path = "plugins/transport/quic", version = "=0.6.0-alpha.1" }
fujin-transport-tcp = { path = "plugins/transport/tcp", version = "=0.6.0-alpha.1" }
fujin-transport-unix = { path = "plugins/transport/unix", version = "=0.6.0-alpha.1" }
fujin-transport-websocket = { path = "plugins/transport/websocket", version = "=0.6.0-alpha.1" }
anyhow = "1.0.100"
arc-swap = "1.9.2"
async-trait = "0.1.89"
clap = { version = "4.6.6", features = ["derive"] }
bytes = "1.12.1"
futures-util = "0.3.34"
parking_lot = "0.12.5"
humantime = "2.4.0"
nix = { version = "0.31.3", features = ["socket", "uio"] }
prost = "0.14.3"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rdkafka = { version = "0.39.0", default-features = false, features = ["tokio", "cmake-build", "static-linking", "libz-static", "ssl-vendored"] }
rcgen = "0.14"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
stats_alloc = "0.1.10"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util", "fs"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "router", "codegen", "tls-ring"] }
tonic-prost = "0.14.6"
tonic-health = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
toml = "1.1.4"
yaml_serde = "0.10.7"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 1
strip = "none"
